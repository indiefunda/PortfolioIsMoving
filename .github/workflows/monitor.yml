name: Monitor Portfolio

# Runs every 10 minutes during US market hours.
# Market is 9:30-16:00 ET. In UTC that is 14:30-21:00 (EST) or 13:30-20:00 (EDT).
# To keep it simple and robust across DST, we run a bit wider window:
#   */10 13-21 * * 1-5  -> every 10 min, hours 13-21 UTC, Mon-Fri
# The script itself double-checks the exact market hours, so extra runs are harmless.
on:
  schedule:
    - cron: "*/10 13-21 * * 1-5"
  workflow_dispatch: # lets you trigger a run manually from the Actions tab

# Need write permission so we can commit state.json back after each run.
# This persists the "already alerted today" list and daily-usage counter,
# so a stock only alerts ONCE per day (not every 10 minutes).
permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Pass both provider keys; monitor.py picks the one matching the
          # provider set in config_local.json. (PRICE_API_KEY kept for backward
          # compatibility with the old single-key setup.)
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          PRICE_API_KEY: ${{ secrets.PRICE_API_KEY }}
        run: python monitor.py

      # Persist state.json so alerts are deduplicated across runs.
      - name: Save state (persist anti-spam + usage)
        run: |
          if [ -f state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update monitor state [skip ci]" || echo "No state changes"
            git push origin HEAD:main
          else
            echo "No state.json to persist"
          fi
